# NoP5-Ghost: YOLO11 with the P5 detection branch removed and C3k2Ghost blocks
# Based on Ultralytics YOLO11 (AGPL-3.0) - https://docs.ultralytics.com/models/yolo11
#
# Changes from stock yolo11.yaml:
#   1. Layers 4, 6, 13, 16: C3k2 -> C3k2Ghost with c3k=False (GhostBottleneck inner blocks)
#   2. Bottom-up PAN path and P5 detection head removed; Detect uses P3 (16) and P4 (13) only
# Requires C3k2Ghost registered in base_modules and repeat_modules (yolo11_fixed_modules.py)
# NOTE: c3k must be False in C3k2Ghost, otherwise it builds C3k blocks and no Ghost blocks

# Parameters
nc: 80 # number of classes
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2  (stock)
  - [-1, 1, Conv, [256, 3, 2]]                   # 3  P3/8
  - [-1, 2, C3k2Ghost, [512, False, 0.25]]       # 4  Ghost (stock: C3k2 [512, False, 0.25])
  - [-1, 1, Conv, [512, 3, 2]]                   # 5  P4/16
  - [-1, 2, C3k2Ghost, [512, False]]             # 6  Ghost (stock: C3k2 [512, True])
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 8  (stock)
  - [-1, 1, SPPF, [1024, 5]]                     # 9  (stock)
  - [-1, 2, C2PSA, [1024]]                       # 10 (stock)

# Head: top-down FPN only, P3 and P4 outputs
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2Ghost, [512, False]]             # 13 P4/16 medium (Ghost)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat backbone P3
  - [-1, 2, C3k2Ghost, [256, False]]             # 16 P3/8 small (Ghost)
  - [[16, 13], 1, Detect, [nc]]                  # 17 Detect(P3, P4)